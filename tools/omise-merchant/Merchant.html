<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お店の情報を更新｜志木なるほど お店めぐりDX</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8f4;color:#193f33;font:16px/1.8 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;padding:18px;margin:auto}section{background:white;border:1px solid #d4e5db;padding:20px;border-radius:16px;margin:16px 0}h1{font-size:25px}h2{font-size:22px}label{display:block;font-weight:700;margin-top:12px}input,textarea,select,button{font:inherit;width:100%;padding:12px;border:1px solid #a8c8b7;border-radius:10px}textarea{min-height:130px}button{background:#146b57;color:white;font-weight:700;margin-top:14px;cursor:pointer}button:disabled{opacity:.6}.secondary{background:#e4f1e9;color:#193f33}.muted{font-size:14px;color:#536d5f}#status{background:#fff5dd;padding:12px;border-radius:10px}img{max-width:100%;border-radius:12px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:8px}[hidden]{display:none!important}a{color:#146b57}.request{border-top:1px solid #d4e5db;padding:14px 0;white-space:pre-wrap}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid orange;outline-offset:3px}</style></head><body><main><h1>お店の情報を更新</h1><p>基本情報は保存するとすぐ反映されます。</p><p><a class="btn wide secondary" href="https://script.google.com/macros/s/AKfycbzMec1R3le4e-cOUyBUl6Eq2dU3OI-5HHtkEyJQT7SWx4IjUHGtW8Z3zatJxoA2GUhn2A/exec?mode=scenes" target="_top">お店の紹介を直す（タイトル・画像・説明文 × 4）</a></p><section id="login"><form id="loginForm"><label for="shopId">お店を選ぶ</label><select id="shopId"><option value="SHOP-0001">おうちcafeパン工房</option><option value="SHOP-0002">ハートネット志木</option><option value="SHOP-0003">ニュータイムス社</option><option value="ADMIN">ふじこ編集長</option></select><label for="code">専用コード</label><input id="code" type="password" autocomplete="current-password" required><p class="muted">お店にお渡ししたコードを入力してください。コードはほかの人に教えないでください。</p><button>更新画面を開く</button></form></section><section id="editor" hidden><h2 id="shopName"></h2><label for="kind">何を変えますか？</label><select id="kind"><option value="info">1 お店の情報を直す</option><option value="media">2 写真・動画を載せる</option><option value="notice">3 今日のお知らせを出す</option></select><form id="editForm"><div id="infoFields"></div><div id="mediaFields" hidden><label for="photos">スマホから写真を選ぶ（4枚まで）</label><input id="photos" type="file" accept="image/*" multiple><div class="preview" id="previews"></div><label for="video">動画のリンク（任意）</label><input id="video" type="url" placeholder="YouTubeなどの動画URL"><p class="muted">写真はスマホから選べます。動画はYouTube・Instagram・Facebookのリンクを貼ってください。</p></div><div id="noticeFields" hidden><label for="noticeTitle">お知らせのタイトル</label><input id="noticeTitle" maxlength="80"><label for="noticeBody">お知らせの本文</label><textarea id="noticeBody" maxlength="1500"></textarea><label for="noticeEnd">いつまで載せる？（任意）</label><input id="noticeEnd" type="date"><p class="muted">特典の内容・条件・期間は、お店で実施するものだけを書いてください。</p></div><button id="submit">基本情報を保存する</button></form></section><section id="admin" hidden><h2>ふじこの確認待ち</h2><div id="requests"></div></section><p id="status" role="status" aria-live="polite" hidden></p><a href="https://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/" target="_top">⌂ DXトップへ戻る</a></main><script>
const $=id=>document.getElementById(id);let session=null,photos=[];const fields=['店名','業種','住所','紹介文','おすすめ商品・サービス','営業時間','定休日','電話番号','公式サイトURL','Instagram URL','Facebook URL','LINE公式URL','YouTube URL','店主のひと言'];
function status(t){$('status').hidden=false;$('status').textContent=t;}function busy(on){document.querySelectorAll('button').forEach(b=>b.disabled=on);}function fail(e){busy(false);status(e.message||String(e));}
function rpc(name,args,done){busy(true);google.script.run.withSuccessHandler(r=>{busy(false);done(r);}).withFailureHandler(fail)[name](...args);}
$('loginForm').onsubmit=e=>{e.preventDefault();const id=$('shopId').value,code=$('code').value.trim();rpc('merchantLogin',[id,code],r=>{session={id,code};$('login').hidden=true;if(r.admin){$('admin').hidden=false;renderRequests(r.requests);}else{$('editor').hidden=false;$('shopName').textContent=r.shop['店名'];$('infoFields').replaceChildren();fields.forEach((k,i)=>{const label=document.createElement('label');label.htmlFor='field'+i;label.textContent=k;const input=document.createElement(k==='紹介文'||k==='おすすめ商品・サービス'?'textarea':'input');input.id='field'+i;input.dataset.field=k;input.value=r.shop[k]||'';input.maxLength=k==='紹介文'?1500:500;$('infoFields').append(label,input);});}status('更新する内容を選んでください。');});};
$('kind').onchange=()=>{['info','media','notice'].forEach(k=>$(k+'Fields').hidden=$('kind').value!==k);$('submit').textContent=$('kind').value==='info'?'基本情報を保存する':'確認をお願いして送る';};
$('photos').onchange=async()=>{photos=[];$('previews').replaceChildren();const files=[...$('photos').files];if(files.length>4){$('photos').value='';status('写真は4枚まで選んでください。');return;}busy(true);try{for(const f of files){const im=await createImageBitmap(f);const canvas=document.createElement('canvas');const ratio=Math.min(1,1000/Math.max(im.width,im.height));canvas.width=Math.round(im.width*ratio);canvas.height=Math.round(im.height*ratio);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);let q=.76,data=canvas.toDataURL('image/jpeg',q);while(data.length>230000&&q>.25){q-=.1;data=canvas.toDataURL('image/jpeg',q);}im.close();if(data.length>240000)throw Error('写真が大きすぎます。別の写真を選んでください。');photos.push(data);const img=document.createElement('img');img.src=data;img.alt='送信する写真';$('previews').append(img);}status(photos.length+'枚を選びました。まだ送信されていません。');}catch(e){photos=[];$('photos').value='';$('previews').replaceChildren();status('写真を読み込めませんでした。JPEGなどの別の写真でお試しください。');}busy(false);};
$('editForm').onsubmit=e=>{e.preventDefault();const type=$('kind').value;let p={};if(type==='info')document.querySelectorAll('[data-field]').forEach(i=>p[i.dataset.field]=i.value);if(type==='notice')p={title:$('noticeTitle').value,body:$('noticeBody').value,end:$('noticeEnd').value};if(type==='media')p={photos,video:$('video').value};rpc('merchantSubmit',[session.id,session.code,type,p],r=>{status(type==='info'?r.message:r.message+' 受付番号：'+r.id);$('submit').textContent=type==='info'?'基本情報を保存する':'続けて別の変更を送る';});};
function renderRequests(rows){$('requests').replaceChildren();if(!rows.length){$('requests').textContent='確認待ちはありません。';return;}rows.forEach(r=>{const box=document.createElement('div');box.className='request';const text=document.createElement('p');text.textContent=r.shop+' / '+({info:'お店の情報',media:'写真・動画',notice:'お知らせ'}[r.type])+'\n'+r.date+'\n'+JSON.stringify(r.payload,null,2);box.append(text);(r.previews||[]).forEach(src=>{const img=document.createElement("img");img.src=src;img.alt="申請された写真";box.append(img);});const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.style.width='auto';label.append(check,document.createTextNode('店舗の掲載許可と内容を確認しました'));box.append(label);for(const approve of [true,false]){const btn=document.createElement('button');btn.type='button';btn.textContent=approve?'確認して公開する':'見送る';if(!approve)btn.className='secondary';btn.onclick=()=>rpc('merchantDecide',[session.code,r.id,approve,check.checked],res=>{renderRequests(res.requests);status(approve?'公開しました。':'見送りにしました。');});box.append(btn);}$('requests').append(box);});}
</script></body></html>
