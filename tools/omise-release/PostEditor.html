<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お店から投稿する</title><style>*{box-sizing:border-box}body{background:#f5f8f4;color:#193f33;margin:0;font:17px/1.7 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:620px;margin:auto;padding:18px 16px 90px}section,article{background:white;border:1px solid #d4e5db;border-radius:16px;padding:20px;margin:18px 0}h1{font-size:25px}h2{font-size:21px}input,select,textarea,button{font:inherit}input,select,textarea{max-width:100%;width:100%;padding:12px;border:1px solid #a8c8b7;border-radius:10px}label{display:block;font-weight:700;margin-top:16px}textarea{min-height:140px}button,.btn{display:inline-block;text-decoration:none;min-height:48px;background:#146b57;color:white;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.wide{width:100%;margin-top:14px}.secondary{background:#e4f1e9;color:#193f33}.danger{background:#fff;color:#b42318;border:1px solid #dca7a2}.danger:focus-visible{outline:3px solid #e3a700;outline-offset:3px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.muted{color:#5c7066;font-size:14px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.status{background:#fff2cf;padding:12px;border-radius:10px}img,video,iframe{display:block;width:100%;max-height:480px;object-fit:contain;border:0;border-radius:12px;margin:12px 0}iframe{height:400px}button:disabled{opacity:.5}[hidden]{display:none!important}.home{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:360px;text-align:center;padding:10px 16px;font-size:16px;border:2px solid white;border-radius:12px;background:#146b57;color:white;text-decoration:none}</style></head><body><main><h1>お店から投稿する</h1><p id="status" class="status" role="status" hidden></p>
<section id="login"><form id="loginForm"><label for="shop">初回だけ、お店を選ぶ</label><select id="shop"><option value="SHOP-0002">ハートネット志木</option><option value="SHOP-0001">おうちcafeパン工房</option><option value="SHOP-0003">ニュータイムス社</option><option value="ADMIN">ふじこ編集長</option></select><label for="code">専用コード</label><input id="code" type="password" autocomplete="current-password" required><label style="display:flex;align-items:center;gap:10px;font-size:15px"><input id="remember" type="checkbox" checked style="width:22px;height:22px">このスマホでログインを保持する</label><p class="muted">次から自分のお店の画面が開きます。有効期間は30日です。</p><button class="wide">自分のページを開く</button></form></section>
<div id="account" hidden class="row" style="align-items:center"><span id="accountName"></span><button id="logout" type="button" class="secondary">ログアウト</button></div>
<div id="owner" hidden><h2 id="shopName"></h2><section id="composer"><div class="composebar"><strong>投稿を作成</strong><button type="submit" form="postForm">次へ</button></div><p class="author" id="composeShop"></p><form id="postForm"><label for="kind" class="sr">投稿の種類</label><select id="kind"><option value="notice">お知らせ</option><option value="deal">お得情報</option></select><label for="body" class="sr">ひと言書く</label><textarea id="body" required maxlength="1500" placeholder="今、伝えたいことを書こう"></textarea><div id="liveMedia"></div><label for="files" class="filelabel">🖼 写真・動画を追加</label><input class="sr" id="files" type="file" accept="image/*,video/*" multiple><p class="muted">写真4枚・動画1本まで。動画は25MBまで。</p><p id="chosen" class="muted"></p><details><summary>掲載終了日（任意）</summary><input id="end" type="date" aria-label="掲載終了日"></details><button id="cancel" class="wide secondary" type="button" hidden>修正をやめる</button></form></section><section id="ownList"><h2>自分の投稿</h2><div id="ownPosts"></div></section></div>
<section id="review" hidden><h2 id="reviewTitle">この内容で投稿しますか？</h2><p id="reviewState" class="status"></p><div id="article"></div><div id="reviewActions"><button id="send" class="wide">投稿する</button><button id="rewrite" class="wide secondary">書き直す</button></div><div id="completeActions" hidden><a id="viewPublic" class="btn wide" target="_blank" rel="noopener">公開された記事を見る</a><p id="pendingNote" class="muted">投稿は届いています。現在は公開確認待ちです。確認が済むとタイムラインにも表示されます。</p><button id="back" class="wide secondary">自分の投稿へ戻る</button></div></section>
<section id="admin" hidden><h2>ふじこの確認待ち</h2><div id="requests"></div></section>
<p><a href="https://script.google.com/macros/s/AKfycbzMec1R3le4e-cOUyBUl6Eq2dU3OI-5HHtkEyJQT7SWx4IjUHGtW8Z3zatJxoA2GUhn2A/exec?mode=info" target="_top">お店の基本情報を直す</a></p></main><a class="home" href="https://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/" target="_top">⌂ DXトップへ戻る</a><script>
const $=id=>document.getElementById(id),base='https://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/';let session=null,own=[],editing=null,draft=null,busyFlag=false,objectURLs=[];
const layout=document.createElement('style');layout.textContent='.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);padding:0;border:0}#composer{padding-top:0}.composebar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white;padding:12px 0;border-bottom:1px solid #d4e5db;z-index:5}.composebar button{background:white;color:#0866c6;padding:8px;font-size:20px}.author{font-weight:700;font-size:20px;padding-top:12px}#kind{width:auto;background:#e5f1ff;color:#0866c6;padding:6px 12px}#body{border:0;min-height:170px;font-size:21px;padding:16px 0;line-height:1.7}.filelabel{border:1px solid #d4e5db;border-radius:10px;padding:12px;color:#146b57;cursor:pointer}#liveMedia img{max-height:none}#status{position:sticky;top:0;z-index:9;border:2px solid #c8931e}';document.head.append(layout);new MutationObserver(()=>$('composeShop').textContent=$('shopName').textContent).observe($('shopName'),{childList:true});$('body').addEventListener('input',()=>{$('body').style.height='auto';$('body').style.height=Math.max(170,$('body').scrollHeight)+'px';});
function status(text){$('status').textContent=text;$('status').hidden=false;$('status').scrollIntoView({block:'start'});}function busy(v){busyFlag=v;document.querySelectorAll('button').forEach(b=>b.disabled=v);}function rpc(name,args){busy(true);return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{busy(false);resolve(r);}).withFailureHandler(e=>{busy(false);status(e.message||String(e));reject(e);})[name](...args));}
function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n;}
function media(box,p){(p.photos||[]).forEach(src=>{if(!/^data:image\/jpeg;base64,/.test(src))return;const im=el('img');im.src=src;im.alt='投稿の写真';box.append(im);});if(p.video||p.videoFileId){const cover=el('div'),play=el('button','▶ 動画を見る','wide secondary');if(p.poster){const img=el('img');img.src=p.poster;img.alt='動画の表紙';cover.append(img);}play.type='button';play.onclick=()=>{play.disabled=true;if(p.video?.startsWith('blob:')){const v=el('video');v.src=p.video;v.controls=true;v.playsInline=true;cover.replaceChildren(v);v.play().catch(()=>{});return;}const frame=el('iframe');frame.src=p.video||'https://drive.google.com/file/d/'+encodeURIComponent(p.videoFileId)+'/preview';frame.title='投稿動画';frame.allow='autoplay; fullscreen';frame.allowFullscreen=true;cover.replaceChildren(frame);};cover.append(play);box.append(cover);}}
function article(box,p){box.replaceChildren();box.append(el('h2',p.name||$('shopName').textContent),el('p',p.kind==='deal'?'お得情報':'お知らせ','muted'),el('p',p.body,'body'));media(box,p);if(p.end)box.append(el('p',p.end+'まで','muted'));}
const rememberKey='shiki-merchant-session-v1';
function forgetLogin(){try{localStorage.removeItem(rememberKey);}catch{}}
function readLogin(){try{const saved=JSON.parse(localStorage.getItem(rememberKey)||'null');if(saved&&/^(SHOP-[0-9]{4}|ADMIN)$/.test(saved.id)&&/^DXS1\.[a-f0-9]{64}$/.test(saved.token)&&Number.isFinite(saved.expiresAt)&&saved.expiresAt>Date.now())return saved;}catch{}forgetLogin();return null;}
function enterOwnPage(id,credential,r,keep){
 const auth=r.auth;
 // Only the revocable session token, never the dedicated code, is persisted.
 const valid=auth&&auth.id===id&&/^DXS1\.[a-f0-9]{64}$/.test(auth.token)&&Number.isFinite(auth.expiresAt)&&auth.expiresAt>Date.now();
 session={id,code:valid?auth.token:credential};
 let saved=false;forgetLogin();if(keep&&valid){try{localStorage.setItem(rememberKey,JSON.stringify(auth));saved=true;}catch{}}
 $('login').hidden=true;$('code').value='';$('status').hidden=true;$('account').hidden=false;
 $('accountName').textContent=id==='ADMIN'?'ふじこ編集長':r.shop['店名'];
 if(id==='ADMIN'){$('admin').hidden=false;renderAdmin(r.posts);}else{own=r.posts;$('shopName').textContent=r.shop['店名'];$('owner').hidden=false;renderOwn();}
 if(keep&&!saved)status('このブラウザではログインを保持できませんでした。この画面では引き続き使えます。');
}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(busyFlag)return;try{const id=$('shop').value,code=$('code').value.trim(),keep=$('remember').checked,r=await rpc('postLogin',[id,code,keep]);enterOwnPage(id,code,r,keep);}catch{}};
$('logout').onclick=async()=>{
 if(busyFlag)return;
 if(draft||editing||$('body').value.trim()||$('files').files.length){if(!confirm('書きかけの内容を閉じてログアウトしますか？'))return;}
 const previous=session;forgetLogin();session=null;own=[];reset();objectURLs.forEach(u=>URL.revokeObjectURL(u));objectURLs=[];
 for(const id of ['owner','review','admin','account'])$(id).hidden=true;
 $('ownPosts').replaceChildren();$('requests').replaceChildren();$('article').replaceChildren();$('shopName').textContent='';$('accountName').textContent='';$('code').value='';$('login').hidden=false;
 if(previous)try{await rpc('postLogout',[previous.id,previous.code]);}catch{status('このスマホのログイン情報は消しました。通信を確認し、もう一度ログインしてください。');return;}
 status('ログアウトしました。');$('code').focus();
};
async function restoreLogin(){
 const saved=readLogin();if(!saved)return;
 $('login').hidden=true;status('自分のお店を開いています…');
 try{const r=await rpc('postLogin',[saved.id,saved.token,true]);enterOwnPage(saved.id,saved.token,r,true);}
 catch{forgetLogin();$('login').hidden=false;$('shop').value=saved.id;status('ログインを確認できませんでした。通信を確認して、専用コードをもう一度入力してください。');}
}
function renderOwn(){$('ownPosts').replaceChildren();if(!own.length)$('ownPosts').append(el('p','まだ投稿はありません。'));own.forEach(p=>{const box=el('article');box.append(el('p',p.status,'muted'),el('p',p.body.split('\n')[0]));const row=el('div',null,'row');for(const [text,fn,cls] of [['記事を見る',()=>show(p,false),'secondary'],['直す',()=>edit(p),'secondary'],['削除',()=>deletePost(p),'danger']]){const b=el('button',text,cls);b.type='button';b.onclick=fn;row.append(b);}box.append(row);$('ownPosts').append(box);});}
function reset(){editing=null;draft=null;$('postForm').reset();$('chosen').textContent='';$('liveMedia').replaceChildren();$('body').style.height='170px';$('cancel').hidden=true;}
function edit(p){editing=p;$('owner').hidden=false;$('review').hidden=true;$('body').value=p.body;$('kind').value=p.kind;$('end').value=p.end||'';$('files').value='';$('liveMedia').replaceChildren();media($('liveMedia'),p);$('chosen').textContent='写真・動画はそのまま残ります。別のものを選ぶと差し替えます。';$('cancel').hidden=false;$('composer').scrollIntoView();}
$('cancel').onclick=reset;
$('files').onchange=async()=>{const selected=[...$('files').files];$('chosen').textContent=selected.length+'件を選びました';$('liveMedia').replaceChildren();for(const file of selected){const url=URL.createObjectURL(file);objectURLs.push(url);if(file.type.startsWith('image/')){const img=el('img');img.src=url;img.alt='選んだ写真';$('liveMedia').append(img);}else if(file.type.startsWith('video/')){const box=el('div'),img=el('img'),v=el('video'),b=el('button','▶ 動画を見る','wide secondary');v.src=url;v.playsInline=true;v.hidden=true;b.type='button';b.onclick=()=>{img.hidden=true;v.hidden=false;v.controls=true;v.play().catch(()=>{});b.hidden=true;};box.append(img,v,b);$('liveMedia').append(box);const poster=await videoPoster(file);if(poster){img.src=poster;img.alt='選んだ動画の表紙';v.poster=poster;}else img.hidden=true;}}};
function dataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob);});}
async function photo(file){const im=await createImageBitmap(file),canvas=document.createElement('canvas'),r=Math.min(1,1000/Math.max(im.width,im.height));canvas.width=Math.round(im.width*r);canvas.height=Math.round(im.height*r);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);im.close();let q=.75,s=canvas.toDataURL('image/jpeg',q);while(s.length>230000&&q>.25){q-=.1;s=canvas.toDataURL('image/jpeg',q);}if(s.length>240000)throw Error('写真が大きすぎます。別の写真を選んでください。');return s;}
async function videoPoster(file){return new Promise(resolve=>{const v=document.createElement('video'),url=URL.createObjectURL(file);v.muted=true;v.playsInline=true;let done=false;const finish=value=>{if(done)return;done=true;URL.revokeObjectURL(url);resolve(value);};v.onloadedmetadata=()=>v.currentTime=Math.min(.1,(v.duration||1)/2);v.onseeked=()=>{try{const c=document.createElement('canvas'),r=Math.min(1,480/v.videoWidth);c.width=Math.round(v.videoWidth*r);c.height=Math.round(v.videoHeight*r);c.getContext('2d').drawImage(v,0,0,c.width,c.height);finish(c.toDataURL('image/jpeg',.65));}catch{finish('');}};v.onerror=()=>finish('');v.src=url;setTimeout(()=>finish(''),5000);});}
$('postForm').onsubmit=async e=>{e.preventDefault();if(busyFlag)return;busy(true);try{const files=[...$('files').files],images=files.filter(f=>f.type.startsWith('image/')),videos=files.filter(f=>f.type.startsWith('video/'));if(images.length>4||videos.length>1||images.length+videos.length!==files.length)throw Error('写真4枚・動画1本まで選べます。');if(videos[0]?.size>25*1024*1024)throw Error('動画は25MB以内の短い動画を選んでください。');const photos=files.length?await Promise.all(images.map(photo)):(editing?.photos||[]);draft={id:editing?.id||'',revision:editing?.request||'',kind:$('kind').value,body:$('body').value.trim(),end:$('end').value,photos,keepVideo:!files.length&&!!editing?.videoFileId};if(videos.length){draft.video=await dataURL(videos[0]);draft.poster=await videoPoster(videos[0]);}const preview={...draft,videoFileId:draft.keepVideo?editing.videoFileId:''};if(draft.video){const blob=videos[0],url=URL.createObjectURL(blob);objectURLs.push(url);preview.video=url;}show(preview,true);$('status').hidden=true;}catch(e){status(e.message||'写真・動画を読み込めませんでした。');}finally{busy(false);}};
function show(p,review){$('owner').hidden=true;$('review').hidden=false;article($('article'),p);$('reviewTitle').textContent=review?'この内容で投稿しますか？':'自分のお店の投稿';$('reviewState').textContent=review?'まだ投稿されていません。見え方を確認して、最後に投稿してください。':p.status==='公開'?'公開済みです':p.status==='見送り'?'見送り：内容を直して投稿できます。':'投稿受付済み・ふじこの確認待ちです。';$('reviewActions').hidden=!review;$('completeActions').hidden=review;$('viewPublic').hidden=review||p.status!=='公開';$('viewPublic').href=base+'article.html?id='+encodeURIComponent(p.id||'');$('pendingNote').hidden=p.status==='公開';$('review').scrollIntoView();}
$('rewrite').onclick=()=>{$('review').hidden=true;$('owner').hidden=false;$('composer').scrollIntoView();};
$('send').onclick=async()=>{if(!draft||busyFlag)return;status('送信しています。このままお待ちください。');try{const r=await rpc('postSend',[session.id,session.code,draft]);own=r.posts;const p=own.find(p=>p.id===r.id);reset();renderOwn();show(p,false);$('reviewTitle').textContent='投稿を受け付けました';$('status').hidden=true;}catch{}};
$('back').onclick=async()=>{try{own=await rpc('postOwn',[session.id,session.code]);$('review').hidden=true;$('owner').hidden=false;renderOwn();$('ownList').scrollIntoView();$('status').hidden=true;}catch{}};
async function deletePost(p){if(!confirm('この記事を削除しますか？\n削除すると投稿一覧とお店のページから消えます。'))return;try{status('削除しています…');const r=await rpc('postDelete',[session.id,session.code,p.id,p.request]);own=r.posts;renderOwn();status('記事を削除しました。');}catch{}}
function renderAdmin(rows){$('requests').replaceChildren();if(!rows.length)$('requests').append(el('p','確認待ちはありません。'));rows.forEach(p=>{const box=el('article');p.name=p.shop;article(box,p);box.prepend(el('p',p.date+(p.ended?'・掲載終了申請':''),'muted'));const label=el('label'),check=el('input');check.type='checkbox';check.style.width='auto';label.append(check,document.createTextNode('掲載内容を確認しました'));box.append(label);const publish=el('button','確認して公開','wide');publish.onclick=async()=>{if(!check.checked){status('掲載内容を確認してチェックしてください。');return;}try{const r=await rpc('postApprove',[session.code,p.request,true]);renderAdmin(r.posts);status('公開しました。DXのタイムラインとお店のページに反映されます。');}catch{}};const reject=el('button','見送る','wide secondary');reject.onclick=async()=>{try{const r=await rpc('postApprove',[session.code,p.request,false]);renderAdmin(r.posts);status('見送りにしました。');}catch{}};box.append(publish,reject);$('requests').append(box);});}
restoreLogin();
</script></body></html>
