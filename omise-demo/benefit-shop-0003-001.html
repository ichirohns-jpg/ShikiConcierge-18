<style>
*{box-sizing:border-box}body{margin:0;background:#f1f0ea;color:#18251f;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:76px}main{max-width:680px;margin:auto;padding:14px}header{max-width:440px;margin:0 auto 16px}header img{display:block;width:100%;height:auto;border-radius:14px}.card{background:#fff;border:1px solid #d8d5c9;border-radius:18px;padding:20px}.shop{margin:0;color:#86651f;font-weight:800}.eyebrow{display:inline-block;margin:7px 0 0;padding:4px 10px;border-radius:99px;background:#f0dfb3;color:#563d08;font-weight:800;font-size:13px}h1{font-size:29px;line-height:1.35;margin:8px 0}.lead{font-weight:700}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:16px 0}.steps span{padding:8px 3px;border-radius:8px;background:#f4f1e8;text-align:center;font-size:12px;font-weight:800}.maker{background:#f8f7f2;border:1px solid #d9d2bf;border-radius:14px;padding:15px;margin-top:16px}.maker h2,.share h2{font-size:20px;margin:0 0 8px}label{display:block;font-weight:800;margin-top:11px}input,select{width:100%;padding:12px;border:1px solid #a69d82;border-radius:9px;background:#fff;font:inherit}.file{padding:9px}.make{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:10px;background:#18251f;color:#fff;font:800 17px inherit}.preview{margin:18px auto 0;max-width:440px}.preview h2{font-size:20px}.canvas-wrap{background:#ddd;border-radius:12px;overflow:hidden;box-shadow:0 5px 18px #0002}.canvas-wrap canvas{display:block;width:100%;height:auto}.save{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border:0;border-radius:10px;padding:10px;text-decoration:none;font-weight:800;cursor:pointer}.download{background:#a36a00;color:#fff}.copy{background:#146b57;color:#fff}.share{margin-top:18px;padding:15px;border:1px solid #d9d2bf;border-radius:14px;background:#f8f7f2;text-align:center}.share p{margin:3px 0 10px;color:#566158}.share-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:7px}.line{background:#087f3e;color:#fff}.facebook{background:#0866c6;color:#fff}.x{background:#151515;color:#fff}.actions{display:grid;gap:9px;margin-top:18px}.actions .btn{background:#e6eee9;color:#155844}.status{min-height:1.4em;margin:6px 0 0;text-align:center;font-size:13px}.dx-home{position:fixed;z-index:1000;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;min-height:46px;padding:10px 16px;border:2px solid #fff;border-radius:12px;background:#146b57;color:#fff;text-align:center;text-decoration:none;font-weight:800;box-shadow:0 2px 8px #0003}@media(max-width:420px){main{padding:10px}.card{padding:15px}h1{font-size:25px}.save{grid-template-columns:1fr}.share-grid{grid-template-columns:1fr 1fr}.line{grid-column:1/-1}}
</style></head><body><main>
<header><a href="./" aria-label="DXトップへ"><img src="./IMG_4358.JPG" alt="志木なるほど お店めぐりDX"></a></header>
<article class="card"><p class="shop">ニュータイムス社</p><span class="eyebrow">地域広告づくり体験版</span>
<h1>写真1枚から<br>地域広告をつくる</h1>
<p class="lead">写真と短い言葉を入れるだけ。SNSに載せられる新聞広告風の縦長画像が、その場で完成します。</p>
<div class="steps"><span>① 写真</span><span>② 見出し</span><span>③ 広告完成</span></div>
<section class="maker"><h2>広告の内容</h2>
<label for="photo">写真を選ぶ</label><input class="file" id="photo" type="file" accept="image/*">
<label for="kind">広告の種類</label><select id="kind"><option>お店の紹介</option><option>商品・サービス</option><option>イベント・募集</option></select>
<label for="headline">一番伝えたいこと</label><input id="headline" value="志木のお店をもっと元気に">
<label for="subline">短い説明</label><input id="subline" value="写真1枚から、伝わる地域広告を作ります。">
<label for="name">店名・活動名</label><input id="name" value="ニュータイムス社">
<button id="make" class="make" type="button">この内容で広告を作る</button></section>
<section class="preview"><h2>完成イメージ</h2><div class="canvas-wrap"><canvas id="ad" width="1080" height="1350" aria-label="作成した広告画像"></canvas></div>
<div class="save"><button id="download" class="btn download" type="button">画像を保存</button><button id="copyText" class="btn copy" type="button">投稿文をコピー</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section>
<section class="share"><h2>この仕掛けを教える</h2><p>友だちや仕事仲間に、そのまま送れます</p><nav class="share-grid"><a id="lineShare" class="btn line" target="_blank" rel="noopener">LINEで送る</a><a id="facebookShare" class="btn facebook" target="_blank" rel="noopener">Facebook</a><a id="xShare" class="btn x" target="_blank" rel="noopener">X</a></nav></section>
<div class="actions"><a class="btn" href="./newtimes.html">ニュータイムス社を見る</a><a class="btn" href="tel:0484866138">電話で相談する</a></div>
</article></main><a class="dx-home" href="./">⌂ DXトップへ戻る</a>
<script>
const canvas=document.getElementById('ad'),ctx=canvas.getContext('2d');let photo=new Image();photo.crossOrigin='anonymous';
function cover(img,x,y,w,h){const r=Math.max(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function lines(text,max,size){ctx.font='900 '+size+'px sans-serif';const chars=[...text],out=[];let line='';for(const c of chars){if(ctx.measureText(line+c).width>max&&line){out.push(line);line=c}else line+=c}if(line)out.push(line);return out.slice(0,3)}
function draw(){const headline=document.getElementById('headline').value.trim()||'伝えたいことを、まっすぐに。',sub=document.getElementById('subline').value.trim()||'地域の魅力を届けます。',name=document.getElementById('name').value.trim()||'ニュータイムス社',kind=document.getElementById('kind').value;
ctx.fillStyle='#f5f0e3';ctx.fillRect(0,0,1080,1350);if(photo.complete&&photo.naturalWidth)cover(photo,0,0,1080,720);else{ctx.fillStyle='#d8d2c1';ctx.fillRect(0,0,1080,720)}
const g=ctx.createLinearGradient(0,430,0,750);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');ctx.fillStyle=g;ctx.fillRect(0,400,1080,350);
ctx.fillStyle='#f0c65a';ctx.fillRect(58,55,240,62);ctx.fillStyle='#2b230f';ctx.font='800 30px sans-serif';ctx.fillText(kind,83,97);
ctx.fillStyle='#fff';ctx.font='800 34px sans-serif';ctx.fillText(name,58,665);
ctx.fillStyle='#18251f';let y=815;for(const l of lines(headline,950,62)){ctx.font='900 62px sans-serif';ctx.fillText(l,58,y);y+=78}
ctx.fillStyle='#6a4c10';ctx.fillRect(58,y+18,130,8);ctx.fillStyle='#29352f';ctx.font='700 35px sans-serif';let sy=y+95;for(const l of lines(sub,940,35)){ctx.fillText(l,58,sy);sy+=50}
ctx.fillStyle='#18251f';ctx.fillRect(0,1260,1080,90);ctx.fillStyle='#fff';ctx.font='800 31px sans-serif';ctx.fillText('ニュータイムス社｜地域の広告を、もっと身近に。',58,1318)}
photo.onload=draw;photo.src='https://ichirohns-jpg.github.io/iwashita-ryu-activity/images/activity/profile-main.jpg';
document.getElementById('photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{photo=new Image();photo.onload=draw;photo.src=rd.result};rd.readAsDataURL(f)};
document.getElementById('make').onclick=()=>{draw();document.querySelector('.preview').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('status').textContent='広告ができました'};
document.getElementById('download').onclick=()=>{draw();const a=document.createElement('a');a.download='newtimes-local-ad.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('status').textContent='画像を保存しました'};
function postText(){return (document.getElementById('name').value.trim()||'ニュータイムス社')+'\n\n'+(document.getElementById('headline').value.trim()||'地域の魅力を届けます。')+'\n'+(document.getElementById('subline').value.trim()||'')+'\n\n詳しくはこちら\nhttps://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/newtimes.html'}
document.getElementById('copyText').onclick=async()=>{await navigator.clipboard.writeText(postText());document.getElementById('status').textContent='投稿文をコピーしました'};
const shareURL='https://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/benefit-shop-0003-001-share.html',shareText='写真1枚で地域広告ができる体験版｜ニュータイムス社\n'+shareURL;
document.getElementById('lineShare').href='https://line.me/R/share?text='+encodeURIComponent(shareText);document.getElementById('facebookShare').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareURL);document.getElementById('xShare').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText);
</script></body></html>
