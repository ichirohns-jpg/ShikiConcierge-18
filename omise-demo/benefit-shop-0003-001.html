<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8f4;color:#174538;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:74px}main{max-width:680px;margin:auto;padding:14px}header{max-width:440px;margin:0 auto 16px}header img{display:block;width:100%;height:auto;border-radius:14px}.card{background:#fff;border:1px solid #d4e5db;border-radius:18px;padding:22px}.shop{font-weight:700;margin:0 0 6px}h1{font-size:27px;line-height:1.45;margin:4px 0 10px}.notice{background:#fff5dd;border-radius:12px;padding:10px 14px;font-size:14px}.builder{background:#f4f8f3;border:1px solid #c5dfcf;border-radius:14px;padding:16px;margin:18px 0}.builder h2,.share h2{font-size:20px;margin:0 0 8px}.choices{display:grid;gap:9px;margin:12px 0}.choice{width:100%;min-height:50px;border:2px solid #b7d5c5;border-radius:10px;background:#fff;color:#174538;text-align:left;padding:10px 14px;font:700 16px/1.4 inherit;cursor:pointer}.choice.selected{border-color:#146b57;background:#e4f1e9}label{display:block;font-weight:700;margin-top:12px}input,textarea{width:100%;padding:12px;border:1px solid #9fc3b0;border-radius:10px;font:inherit;margin-top:5px}textarea{min-height:100px}.make{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:10px;background:#146b57;color:#fff;font:700 17px inherit;cursor:pointer}.result{margin-top:14px;padding:14px;background:#fff;border-radius:12px}.result pre{white-space:pre-wrap;font:inherit;margin:0}.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:10px;padding:10px;text-decoration:none;font-weight:700;cursor:pointer}.result .btn{margin-top:10px;background:#146b57;color:#fff}.share{background:#f4f8f3;border:1px solid #c5dfcf;border-radius:14px;padding:16px;margin-top:18px}.share>h2,.share>p{text-align:center}.share>p{margin:2px 0 12px;color:#466555}.share-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.share-grid .line{grid-column:1/-1;background:#087f3e;color:#fff;font-size:18px}.facebook{background:#0866c6;color:#fff}.x{background:#151515;color:#fff}.copy{background:#146b57;color:#fff}.small{font-size:13px;white-space:nowrap;padding:8px 3px}.actions{display:grid;gap:10px;margin-top:18px}.actions .btn{background:#e4f1e9;color:#155844}.status{min-height:1.5em;margin:7px 0 0;text-align:center;font-size:13px}.dx-home{position:fixed;z-index:1000;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;min-height:46px;padding:10px 16px;border:2px solid #fff;border-radius:12px;background:#146b57;color:#fff;text-align:center;text-decoration:none;font-weight:700;box-shadow:0 2px 8px #0003}@media(max-width:420px){main{padding:10px}.card{padding:16px}h1{font-size:24px}header{max-width:280px}}
</style></head><body><main>
<header><a href="./" aria-label="DXトップへ"><img src="./IMG_4358.JPG" alt="志木なるほど お店めぐりDX"></a></header>
<article class="card"><p class="shop">ニュータイムス社</p><h1>お店のPR相談メモを<br>かんたん作成</h1>
<p>伝えたい目的を1つ選ぶだけ。広告や地域情報誌の相談前に、考えを短く整理できます。</p>
<p class="notice"><strong>掲載体験版</strong>｜この画面から相談内容は送信されません。</p>
<section class="builder" aria-label="PR相談メモを作る"><h2>何を伝えたいですか？</h2>
<div class="choices"><button class="choice" data-goal="お店や活動を知ってほしい">お店・活動を知ってほしい</button><button class="choice" data-goal="商品やサービスを紹介したい">商品・サービスを紹介したい</button><button class="choice" data-goal="イベントや募集を知らせたい">イベント・募集を知らせたい</button></div>
<label for="name">店名・活動名（任意）</label><input id="name" placeholder="例：〇〇商店">
<label for="detail">伝えたいこと（任意）</label><textarea id="detail" placeholder="例：新商品の販売を始めました"></textarea>
<button id="make" class="make" type="button">相談メモを作る</button>
<div id="result" class="result" hidden><h2>PR相談メモ</h2><pre id="memo"></pre><button id="copyMemo" class="btn" type="button">相談メモをコピー</button><p id="memoStatus" class="status" role="status" aria-live="polite"></p></div>
</section>
<section class="share" aria-label="友だちに教える"><h2>この仕掛けを友だちに教える</h2><p>送る方法を選んでください</p><nav class="share-grid"><a id="lineShare" class="btn line" target="_blank" rel="noopener">LINEで送る</a><a id="facebookShare" class="btn facebook small" target="_blank" rel="noopener">Facebook</a><a id="xShare" class="btn x small" target="_blank" rel="noopener">X</a><button id="copyShare" class="btn copy small" type="button">コピー</button></nav><p id="shareStatus" class="status" role="status" aria-live="polite"></p></section>
<div class="actions"><a class="btn" href="./newtimes.html">ニュータイムス社を見る</a><a class="btn" href="tel:0484866138">電話で問い合わせ</a></div>
</article></main><a class="dx-home" href="./">⌂ DXトップへ戻る</a>
<script>
let goal='';
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{goal=b.dataset.goal;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x===b));});
document.getElementById('make').onclick=()=>{if(!goal){alert('伝えたい目的を1つ選んでください');return;}const name=document.getElementById('name').value.trim()||'未入力';const detail=document.getElementById('detail').value.trim()||'相談しながら決めたい';const text='【PR相談メモ】\n店名・活動名：'+name+'\n目的：'+goal+'\n伝えたいこと：'+detail+'\n\n紙面・広告・地域情報誌での伝え方を相談したいです。';document.getElementById('memo').textContent=text;document.getElementById('result').hidden=false;document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'});};
document.getElementById('copyMemo').onclick=async()=>{await navigator.clipboard.writeText(document.getElementById('memo').textContent);document.getElementById('memoStatus').textContent='コピーしました';};
const shareURL="https://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/benefit-shop-0003-001-share.html";const shareText='ニュータイムス社｜お店のPR相談メモをかんたん作成\n\n'+shareURL;
document.getElementById('lineShare').href='https://line.me/R/share?text='+encodeURIComponent(shareText);document.getElementById('facebookShare').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareURL);document.getElementById('xShare').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(shareText);document.getElementById('copyShare').onclick=async()=>{await navigator.clipboard.writeText(shareText);document.getElementById('shareStatus').textContent='コピーしました';};
</script></body></html>
