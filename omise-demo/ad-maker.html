<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#531a65">
<title>SNS広告画像を作る｜志木なるほど お店めぐりDX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f1f5;color:#341a3c;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:100px}main{max-width:680px;margin:auto;padding:12px}header{max-width:420px;margin:0 auto 16px}header img{display:block;width:100%;border-radius:14px}.card{background:#fff;border:2px solid #dbd0df;border-radius:22px;padding:22px 18px}h1{font-size:34px;line-height:1.25;margin:0 0 12px}.lead{font-size:21px;line-height:1.55;font-weight:800;margin:0 0 22px}.step{margin:0 0 24px}.step-title{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;margin-bottom:10px}.num{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#531a65;color:#fff;font-size:22px;flex:none}input{width:100%;min-height:68px;padding:14px 16px;border:3px solid #ab94b2;border-radius:14px;background:#fff;font:700 22px/1.35 inherit;color:#341a3c}.file{padding:13px;font-size:18px}.hint{font-size:17px;font-weight:700;color:#67526d;margin:8px 0 0}.optional{font-size:16px;color:#77687b}.make{width:100%;min-height:76px;margin-top:4px;border:0;border-radius:16px;background:#e87919;color:#fff;font:900 27px inherit;box-shadow:0 5px 0 #b9560d}.make:active{transform:translateY(3px);box-shadow:0 2px 0 #b9560d}.preview{display:none;margin-top:24px}.preview.show{display:block}.preview h2{font-size:28px;margin:0 0 10px}.canvas-wrap{background:#e2dce4;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #0002}.canvas-wrap canvas{display:block;width:100%;height:auto}.save{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}.btn{display:flex;align-items:center;justify-content:center;min-height:68px;border:0;border-radius:14px;padding:12px;font:900 23px inherit;cursor:pointer}.download{background:#a36a00;color:#fff}.copy{background:#531a65;color:#fff}.status{min-height:1.5em;margin:8px 0 0;text-align:center;font-size:17px;font-weight:800}.back{position:fixed;z-index:1000;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 28px);max-width:420px;min-height:56px;padding:12px 16px;border:3px solid #fff;border-radius:14px;background:#531a65;color:#fff;text-align:center;text-decoration:none;font-size:20px;font-weight:900;box-shadow:0 3px 10px #0003}@media(max-width:420px){main{padding:8px}.card{padding:20px 15px}h1{font-size:30px}.lead{font-size:19px}.step-title{font-size:23px}input{font-size:20px}}
</style><link rel="stylesheet" href="./dx-nav.css?v=20261029-editor-entry"><script src="./dx-nav.js?v=20261029-editor-entry" defer></script><style>body .make{font-size:18px;min-height:52px;box-shadow:none}body .step-title{font-size:20px}body .lead{font-size:16px;font-weight:400}body .num{width:32px;height:32px;font-size:18px}body input{min-height:48px;border-width:1px;font-size:16px}body .hint{font-size:14px;font-weight:400}body .back{display:none}</style></head><body><main>
<header><a href="./" aria-label="DXトップへ"><img src="./IMG_4358.JPG" alt="志木なるほど お店めぐりDX"></a></header>
<article class="card">
<h1>SNS用の画像を作る</h1>
<p class="lead">写真を選んで、伝えたいことを書く。<br>あとはボタンを押すだけです。</p>

<div class="step">
<div class="step-title"><span class="num">1</span><span>写真を選ぶ</span></div>
<input class="file" id="photo" type="file" accept="image/*">
<p class="hint">縦でも横でも、自動で合わせます。</p>
</div>

<div class="step">
<div class="step-title"><span class="num">2</span><span>伝えたいことを書く</span></div>
<input id="headline" maxlength="40" placeholder="例：新しいパンができました">
</div>

<div class="step">
<div class="step-title"><span class="num">3</span><span>ひとこと説明</span></div>
<input id="subline" maxlength="60" placeholder="例：今日17時まで販売します">
<p class="hint optional">説明がなければ空欄でも大丈夫です。</p>
</div>

<button id="make" class="make" type="button">画像を作る</button>

<section class="preview" id="preview">
<h2>できあがり</h2>
<div class="canvas-wrap"><canvas id="ad" width="1080" height="1350" aria-label="作成した広告画像"></canvas></div>
<div class="save">
<button id="download" class="btn download" type="button">画像を保存する</button>
<button id="copyText" class="btn copy" type="button">投稿する文章をコピー</button>
</div>
<p id="status" class="status" role="status" aria-live="polite"></p>
</section>
</article></main>
<button class="back" type="button" onclick="history.back()">← お店の操作へ戻る</button>
<script>
const q=new URLSearchParams(location.search),canvas=document.getElementById('ad'),ctx=canvas.getContext('2d');let photo=null;
const shopName=q.get('name')||'お店の名前';
function autoPhoto(img,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();const br=Math.max(w/img.width,h/img.height),bw=img.width*br,bh=img.height*br;ctx.filter='blur(30px) brightness(.72)';ctx.drawImage(img,x+(w-bw)/2-35,y+(h-bh)/2-35,bw+70,bh+70);ctx.filter='none';ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x,y,w,h);const r=Math.min(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);ctx.restore()}
function lines(text,max,size,count){ctx.font='900 '+size+'px sans-serif';const chars=[...text],out=[];let line='';for(const c of chars){if(ctx.measureText(line+c).width>max&&line){out.push(line);line=c}else line+=c}if(line)out.push(line);return out.slice(0,count)}
function draw(){const headline=document.getElementById('headline').value.trim()||'伝えたいこと',sub=document.getElementById('subline').value.trim();
ctx.fillStyle='#f5f0e3';ctx.fillRect(0,0,1080,1350);
if(photo)autoPhoto(photo,0,0,1080,760);else{ctx.fillStyle='#e6e0e8';ctx.fillRect(0,0,1080,760);ctx.fillStyle='#5e4765';ctx.textAlign='center';ctx.font='900 52px sans-serif';ctx.fillText('写真を選んでください',540,380);ctx.textAlign='left'}
const g=ctx.createLinearGradient(0,450,0,780);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.76)');ctx.fillStyle=g;ctx.fillRect(0,420,1080,360);
ctx.fillStyle='#fff';ctx.font='900 38px sans-serif';ctx.fillText(shopName,58,700);
ctx.fillStyle='#251829';let y=875;for(const l of lines(headline,950,70,3)){ctx.font='900 70px sans-serif';ctx.fillText(l,58,y);y+=86}
if(sub){ctx.fillStyle='#d87719';ctx.fillRect(58,y+12,150,9);ctx.fillStyle='#322a34';ctx.font='700 39px sans-serif';let sy=y+100;for(const l of lines(sub,940,39,2)){ctx.fillText(l,58,sy);sy+=57}}
ctx.fillStyle='#531a65';ctx.fillRect(0,1260,1080,90);ctx.fillStyle='#fff';ctx.font='800 31px sans-serif';ctx.fillText(shopName+'｜志木なるほど お店めぐりDX',58,1318)}
document.getElementById('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;const status=document.getElementById('status');try{photo=await createImageBitmap(f,{imageOrientation:'from-image'});status.textContent='写真を選びました'}catch{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{photo=im;status.textContent='写真を選びました'};im.src=rd.result};rd.readAsDataURL(f)}};
document.getElementById('make').onclick=()=>{if(!photo){alert('最初に写真を選んでください');return}if(!document.getElementById('headline').value.trim()){alert('伝えたいことを書いてください');return}draw();const p=document.getElementById('preview');p.classList.add('show');p.scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('status').textContent='画像ができました'};
document.getElementById('download').onclick=()=>{draw();const a=document.createElement('a');a.download='SNS広告画像.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('status').textContent='画像を保存しました'};
function postText(){const h=document.getElementById('headline').value.trim(),s=document.getElementById('subline').value.trim();return [shopName,h,s].filter(Boolean).join('\n\n')}
document.getElementById('copyText').onclick=async()=>{await navigator.clipboard.writeText(postText());document.getElementById('status').textContent='投稿する文章をコピーしました'};
</script></body></html>
