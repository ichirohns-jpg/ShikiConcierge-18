<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#146b57">
<title>SNS広告画像を作る｜志木なるほど お店めぐりDX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f2;color:#183f34;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding-bottom:80px}main{max-width:680px;margin:auto;padding:14px}header{max-width:400px;margin:0 auto 14px}header img{display:block;width:100%;border-radius:14px}.card{background:#fff;border:1px solid #d3e2da;border-radius:18px;padding:20px}h1{font-size:27px;line-height:1.35;margin:0 0 8px}.lead{font-weight:700}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}.steps span{padding:8px 3px;border-radius:8px;background:#e9f1ed;text-align:center;font-size:12px;font-weight:800}.maker{background:#f5f8f6;border:1px solid #c8dcd1;border-radius:14px;padding:15px;margin-top:16px}h2{font-size:20px;margin:0 0 8px}label{display:block;font-weight:800;margin-top:11px}input,select{width:100%;padding:12px;border:1px solid #99baa9;border-radius:9px;background:#fff;font:inherit}.file{padding:9px}.make{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:10px;background:#146b57;color:#fff;font:800 17px inherit}.preview{margin:18px auto 0;max-width:440px}.canvas-wrap{background:#dbe5df;border-radius:12px;overflow:hidden;box-shadow:0 5px 18px #0002}.canvas-wrap canvas{display:block;width:100%;height:auto}.save{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border:0;border-radius:10px;padding:10px;text-decoration:none;font-weight:800;cursor:pointer}.download{background:#a36a00;color:#fff}.copy{background:#146b57;color:#fff}.status{min-height:1.4em;margin:6px 0 0;text-align:center;font-size:13px}.back{position:fixed;z-index:1000;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;min-height:46px;padding:10px 16px;border:2px solid #fff;border-radius:12px;background:#146b57;color:#fff;text-align:center;text-decoration:none;font-weight:800;box-shadow:0 2px 8px #0003}@media(max-width:420px){main{padding:10px}.card{padding:15px}h1{font-size:24px}.save{grid-template-columns:1fr}}
</style></head><body><main>
<header><a href="./" aria-label="DXトップへ"><img src="./IMG_4358.JPG" alt="志木なるほど お店めぐりDX"></a></header>
<article class="card"><h1>SNS広告画像を作る</h1><p class="lead">写真と短い言葉を入れるだけで、SNSに載せられる4対5の広告画像が完成します。</p>
<div class="steps"><span>① 写真</span><span>② 見出し</span><span>③ 保存</span></div>
<section class="maker"><h2>広告の内容</h2>
<label for="photo">広告に使う写真</label><input class="file" id="photo" type="file" accept="image/*"><p class="status" style="text-align:left">縦・横どちらの写真も、切れないように自動で枠へ合わせます。</p>
<label for="kind">内容</label><select id="kind"><option>お店の紹介</option><option>商品・サービス</option><option>お得情報</option><option>イベント・募集</option></select>
<label for="headline">一番伝えたいこと</label><input id="headline" maxlength="40" placeholder="例：焼きたてパンができました">
<label for="subline">短い説明</label><input id="subline" maxlength="70" placeholder="例：本日17時まで販売しています">
<label for="name">店名・活動名</label><input id="name" maxlength="50">
<button id="make" class="make" type="button">広告画像を作る</button></section>
<section class="preview"><h2>完成イメージ</h2><div class="canvas-wrap"><canvas id="ad" width="1080" height="1350" aria-label="作成した広告画像"></canvas></div>
<div class="save"><button id="download" class="btn download" type="button">画像を保存</button><button id="copyText" class="btn copy" type="button">投稿文をコピー</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section>
</article></main><button class="back" type="button" onclick="history.back()">← お店の操作へ戻る</button>
<script>
const q=new URLSearchParams(location.search),canvas=document.getElementById('ad'),ctx=canvas.getContext('2d');let photo=null;
document.getElementById('name').value=q.get('name')||'';
function autoPhoto(img,x,y,w,h){ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();const br=Math.max(w/img.width,h/img.height),bw=img.width*br,bh=img.height*br;ctx.filter='blur(30px) brightness(.72)';ctx.drawImage(img,x+(w-bw)/2-35,y+(h-bh)/2-35,bw+70,bh+70);ctx.filter='none';ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(x,y,w,h);const r=Math.min(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);ctx.restore()}
function lines(text,max,size){ctx.font='900 '+size+'px sans-serif';const chars=[...text],out=[];let line='';for(const c of chars){if(ctx.measureText(line+c).width>max&&line){out.push(line);line=c}else line+=c}if(line)out.push(line);return out.slice(0,3)}
function draw(){const headline=document.getElementById('headline').value.trim()||'伝えたい見出しが入ります',sub=document.getElementById('subline').value.trim()||'短い説明が入ります',name=document.getElementById('name').value.trim()||'お店の名前',kind=document.getElementById('kind').value;
ctx.fillStyle='#f5f0e3';ctx.fillRect(0,0,1080,1350);
if(photo)autoPhoto(photo,0,0,1080,720);else{ctx.fillStyle='#dfe9e3';ctx.fillRect(0,0,1080,720);ctx.fillStyle='#45675b';ctx.textAlign='center';ctx.font='800 48px sans-serif';ctx.fillText('写真を選んでください',540,350);ctx.textAlign='left'}
const g=ctx.createLinearGradient(0,430,0,750);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.72)');ctx.fillStyle=g;ctx.fillRect(0,400,1080,350);
ctx.fillStyle='#f0c65a';ctx.fillRect(58,55,260,62);ctx.fillStyle='#2b230f';ctx.font='800 30px sans-serif';ctx.fillText(kind,83,97);
ctx.fillStyle='#fff';ctx.font='800 34px sans-serif';ctx.fillText(name,58,665);
ctx.fillStyle='#18251f';let y=815;for(const l of lines(headline,950,62)){ctx.font='900 62px sans-serif';ctx.fillText(l,58,y);y+=78}
ctx.fillStyle='#6a4c10';ctx.fillRect(58,y+18,130,8);ctx.fillStyle='#29352f';ctx.font='700 35px sans-serif';let sy=y+95;for(const l of lines(sub,940,35)){ctx.fillText(l,58,sy);sy+=50}
ctx.fillStyle='#146b57';ctx.fillRect(0,1260,1080,90);ctx.fillStyle='#fff';ctx.font='800 31px sans-serif';ctx.fillText(name+'｜志木なるほど お店めぐりDX',58,1318)}
draw();
document.getElementById('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;const status=document.getElementById('status');status.textContent='写真を自動調整しています…';try{photo=await createImageBitmap(f,{imageOrientation:'from-image'});draw();status.textContent='写真を広告枠に自動調整しました'}catch{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{photo=im;draw();status.textContent='写真を広告枠に自動調整しました'};im.src=rd.result};rd.readAsDataURL(f)}};
document.getElementById('make').onclick=()=>{draw();document.querySelector('.preview').scrollIntoView({behavior:'smooth',block:'start'});document.getElementById('status').textContent='広告画像ができました'};
document.getElementById('download').onclick=()=>{draw();const a=document.createElement('a');a.download='SNS広告画像.png';a.href=canvas.toDataURL('image/png');a.click();document.getElementById('status').textContent='画像を保存しました'};
function postText(){const n=document.getElementById('name').value.trim(),h=document.getElementById('headline').value.trim(),s=document.getElementById('subline').value.trim();return [n,h,s].filter(Boolean).join('\n\n')}
document.getElementById('copyText').onclick=async()=>{await navigator.clipboard.writeText(postText());document.getElementById('status').textContent='投稿文をコピーしました'};
</script></body></html>
