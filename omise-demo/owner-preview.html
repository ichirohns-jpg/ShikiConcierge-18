<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#146b57"><title>投稿画面のお試し｜お店めぐりDX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#193f33;font:17px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif}main{max-width:600px;margin:auto;padding:16px 16px 85px}h1{font-size:25px;margin:12px 0}h2{font-size:21px;margin:0 0 12px}p{margin:8px 0}section,article{background:white;padding:20px;border:1px solid #d4e5db;border-radius:18px;margin:18px 0}button,input,textarea,select{font:inherit}button,.button{cursor:pointer;min-height:48px;border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:#146b57;color:white;text-decoration:none;text-align:center}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e5f0e9;color:#193f33}.wide{display:block;width:100%}label{display:block;font-weight:700;margin-top:18px}select,textarea,input[type=date]{width:100%;border:1px solid #9ab7a8;border-radius:10px;padding:12px;background:white;color:#193f33}textarea{min-height:140px;resize:vertical}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs button{background:#edf3ee;color:#426252;border:2px solid transparent}.tabs button[aria-pressed=true]{background:#e2f1e6;border-color:#146b57;color:#114d3b}.muted{color:#5c7066;font-size:14px}.trial{background:#fff2cf;padding:12px 16px;border-radius:12px;font-size:14px}#message{background:#e3f0e9;border-radius:12px;padding:12px;margin-top:16px}.media{display:grid;gap:10px;margin:12px 0}.media img,.media video{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:12px;background:#f2f5f1}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:90px}.body{white-space:pre-wrap;overflow-wrap:anywhere}.badge{display:inline-block;background:#e4efe7;border-radius:20px;padding:2px 10px;font-size:13px}.ended{opacity:.7}.home{position:fixed;bottom:8px;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:360px;min-height:46px;padding:10px 16px;background:#146b57;color:white;border:2px solid white;border-radius:12px;text-align:center;text-decoration:none;font-size:16px;font-weight:700;box-shadow:0 2px 10px #0002}[hidden]{display:none!important}button:focus-visible,a:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #e8a33b;outline-offset:3px}input[type=file]{max-width:100%;font-size:15px}
</style></head><body><main>
<p class="muted">志木なるほど お店めぐりDX</p><h1>お店から投稿する</h1>
<p class="trial">操作確認版です。投稿や選んだ写真・動画はこの端末のブラウザにだけ保存され、お客さんには公開されません。</p>
<section id="composer"><h2 id="formHeading">何を伝えますか？</h2>
<form id="postForm">
<div class="tabs" role="group" aria-label="投稿の種類"><button type="button" id="noticeTab" aria-pressed="true">お知らせ</button><button type="button" id="dealTab" aria-pressed="false">お得情報</button></div>
<label for="shop">お店</label><select id="shop"><option>ハートネット志木</option><option>おうちcafeパン工房</option><option>ニュータイムス社</option></select>
<label for="body">ひと言書く</label><textarea id="body" required maxlength="1500" placeholder="例：今日は新しいパンが焼けました！"></textarea>
<label for="files">写真・動画を付ける <span class="muted">任意</span></label><input id="files" type="file" accept="image/*,video/*" multiple><p class="muted">スマホにあるものを選べます。写真4枚・動画1本まで。</p><div class="media" id="selected"></div>
<details><summary>掲載終了日を決める（任意）</summary><label for="end">この日まで掲載</label><input type="date" id="end"></details>
<button class="wide" style="margin-top:22px" id="send">投稿内容を確認する</button><button type="button" class="secondary wide" id="cancel" style="margin-top:10px" hidden>修正をやめる</button>
</form><p id="message" role="status" aria-live="polite" hidden></p></section>
<section id="customer" hidden aria-live="polite"><h2 id="reviewHeading">自分のお店のページで確認</h2><p class="trial" id="reviewStatus"></p><div id="article"></div><p id="submitError" role="alert" hidden></p><div id="reviewActions" hidden><button class="wide" id="confirmSend">この内容で送信する</button><button class="secondary wide" style="margin-top:10px" id="rewrite">書き直す</button></div><div id="savedActions"><button class="wide" id="nextPost">もう1件書く</button><button class="secondary wide" style="margin-top:10px" id="closeCustomer">自分の投稿一覧へ</button></div></section>
<section id="history"><h2>自分のお店の投稿一覧（お試し）</h2><p class="muted">記事を見るときは「記事を見る」を押してください。</p><div id="posts"></div><p id="empty">まだ保存した記事はありません。</p></section>
</main><a class="home" href="./">⌂ DXトップへ戻る</a>
<script>
'use strict';
const $=id=>document.getElementById(id);let db,kind='notice',editing=null,attachments=[],posts=[],urls=[],draft=null;
function message(t){$('message').hidden=false;$('message').textContent=t;}
function setKind(k){kind=k;$('noticeTab').setAttribute('aria-pressed',String(k==='notice'));$('dealTab').setAttribute('aria-pressed',String(k==='deal'));$('body').placeholder=k==='deal'?'例：今週は対象商品が10％引き。会計前にこの画面を見せてください。':'例：今日は新しいパンが焼けました！';}
$('noticeTab').onclick=()=>setKind('notice');$('dealTab').onclick=()=>setKind('deal');
const opening=indexedDB.open('omise-owner-operation-preview-v1',1);opening.onupgradeneeded=()=>opening.result.createObjectStore('posts',{keyPath:'id'});opening.onsuccess=()=>{db=opening.result;refresh();};opening.onerror=()=>{message('このブラウザでは保存を利用できません。通常のブラウザで開いてください。');$('send').disabled=true;};
function request(mode,action){return new Promise((resolve,reject)=>{const tx=db.transaction('posts',mode);const req=action(tx.objectStore('posts'));tx.oncomplete=()=>resolve(req.result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('保存できませんでした。'));});}
function showMedia(container,items){container.replaceChildren();for(const item of items){const url=URL.createObjectURL(item.blob);urls.push(url);if(!item.type.startsWith('video/')){const img=document.createElement('img');img.src=url;img.alt='投稿の写真';container.append(img);continue;}const wrap=document.createElement('div'),cover=document.createElement('div'),label=document.createElement('p'),thumb=document.createElement('img'),video=document.createElement('video'),play=document.createElement('button');label.textContent='動画の表紙を読み込み中…';label.className='muted';thumb.alt='動画の表紙';thumb.hidden=true;cover.append(label,thumb);video.hidden=true;video.playsInline=true;video.preload='auto';video.muted=true;video.src=url;let captured=false;function capture(){if(captured||!video.videoWidth||video.readyState<2)return;try{const canvas=document.createElement('canvas'),scale=Math.min(1,720/video.videoWidth);canvas.width=Math.round(video.videoWidth*scale);canvas.height=Math.round(video.videoHeight*scale);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const poster=canvas.toDataURL('image/jpeg',.88);thumb.src=poster;video.poster=poster;thumb.hidden=false;label.hidden=true;captured=true;}catch{label.textContent='動画を選択しました';}}video.addEventListener('loadedmetadata',()=>{try{video.currentTime=Math.min(.1,(video.duration||1)/2);}catch{capture();}});video.addEventListener('loadeddata',capture);video.addEventListener('seeked',capture);video.addEventListener('error',()=>label.textContent='動画を選択しました。再生して確認してください。');play.type='button';play.className='wide';play.textContent='▶ 動画を見る';play.onclick=async()=>{cover.hidden=true;video.hidden=false;video.controls=true;video.muted=false;play.hidden=true;try{await video.play();}catch{play.hidden=false;play.textContent='▶ もう一度再生する';}};wrap.append(cover,video,play);container.append(wrap);}}
$('files').onchange=()=>{const chosen=[...$('files').files];const pictures=chosen.filter(f=>f.type.startsWith('image/')),videos=chosen.filter(f=>f.type.startsWith('video/'));if(pictures.length>4||videos.length>1||pictures.length+videos.length!==chosen.length){message('写真は4枚、動画は1本まで選べます。');$('files').value='';return;}attachments=chosen.map(f=>({type:f.type,blob:f}));showMedia($('selected'),attachments);};
function reset(){editing=null;attachments=[];$('postForm').reset();setKind('notice');$('selected').replaceChildren();$('send').textContent='投稿内容を確認する';$('formHeading').textContent='何を伝えますか？';$('cancel').hidden=true;$('shop').disabled=false;}
$('cancel').onclick=reset;
function today(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date());}
function ended(p){return p.ended||Boolean(p.end&&p.end<today());}
function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
async function refresh(){posts=await request('readonly',s=>s.getAll());posts.sort((a,b)=>b.created-a.created);$('posts').replaceChildren();const own=posts.filter(p=>p.shop===$('shop').value);$('empty').hidden=own.length>0;for(const p of own){const card=node('article');if(ended(p))card.className='ended';card.append(node('span',ended(p)?'掲載終了':p.kind==='deal'?'お得情報':'お知らせ','badge'));card.append(node('p',p.body.split('\n')[0].slice(0,80)));if(p.attachments.length)card.append(node('p',p.attachments.map(a=>a.type.startsWith('video/')?'動画':'写真').join('・'),'muted'));const actions=node('div',null,'actions');for(const [label,fn] of [['記事を見る',()=>view(p)],['直す',()=>edit(p)],['掲載終了',()=>finish(p)]]){const b=node('button',label,'secondary');b.type='button';b.onclick=fn;if(label==='掲載終了'&&ended(p))b.disabled=true;actions.append(b);}card.append(actions);$('posts').append(card);}}
$('shop').onchange=()=>{if(db)refresh();};
$('postForm').onsubmit=e=>{e.preventDefault();if(!db)return;const body=$('body').value.trim();if(!body){message('ひと言書いてください。');return;}const old=posts.find(p=>p.id===editing);draft={id:editing||crypto.randomUUID(),shop:$('shop').value,kind,body,end:$('end').value,attachments:[...attachments],created:old?.created||Date.now(),ended:false};$('message').hidden=true;view(draft,'review');};
$('confirmSend').onclick=async()=>{if(!draft||$('confirmSend').disabled)return;$('confirmSend').disabled=true;$('rewrite').disabled=true;const p=draft;try{await request('readwrite',s=>s.put(p));draft=null;const shop=p.shop;reset();$('shop').value=shop;await refresh();view(p,'complete');}catch(err){$('submitError').hidden=false;$('submitError').textContent='送信できませんでした。内容は残っています。写真・動画を減らしてお試しください。';}finally{$('confirmSend').disabled=false;$('rewrite').disabled=false;}};
$('rewrite').onclick=()=>{$('customer').hidden=true;$('history').hidden=false;$('composer').hidden=false;$('composer').scrollIntoView({behavior:'instant'});$('body').focus();};
function edit(p){editing=p.id;setKind(p.kind);$('shop').value=p.shop;$('shop').disabled=true;$('body').value=p.body;$('end').value=p.end;attachments=[...p.attachments];$('files').value='';showMedia($('selected'),attachments);$('send').textContent='直して送る';$('formHeading').textContent='この記事を直す';$('cancel').hidden=false;$('composer').scrollIntoView({behavior:'smooth'});}
async function finish(p){try{await request('readwrite',s=>s.put({...p,ended:true}));await refresh();message('この記事を掲載終了にしました。履歴は残っています。');}catch{message('保存できませんでした。もう一度お試しください。');}}
function view(p,mode='saved'){const reviewing=mode==='review';$('reviewHeading').textContent=reviewing?'この内容で投稿しますか？':mode==='complete'?'お試し投稿が完了しました':'自分のお店のページ';$('reviewStatus').textContent=reviewing?'まだ送信されていません。下の内容を確認して、最後に送信してください。':'この端末に保存済みです。操作確認版のため、本番には公開されません。';$('reviewActions').hidden=!reviewing;$('savedActions').hidden=reviewing;$('submitError').hidden=true;const box=$('article');box.replaceChildren();box.append(node('h2',p.shop),node('span',ended(p)?'掲載終了':p.kind==='deal'?'お得情報':'お知らせ','badge'),node('p',p.body,'body'));const media=node('div',null,'media');showMedia(media,p.attachments);box.append(media);if(p.end)box.append(node('p',p.end+'まで','muted'));$('composer').hidden=true;$('history').hidden=true;$('customer').hidden=false;$('customer').scrollIntoView({behavior:'instant'});}
$('closeCustomer').onclick=()=>{$('customer').hidden=true;$('history').hidden=false;$('composer').hidden=false;$('history').scrollIntoView({behavior:'instant'});};
$('nextPost').onclick=()=>{$('customer').hidden=true;$('history').hidden=false;$('composer').hidden=false;$('composer').scrollIntoView({behavior:'instant'});$('body').focus();};
window.addEventListener('pagehide',()=>urls.forEach(u=>URL.revokeObjectURL(u)));
</script></body></html>
