<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お店の紹介を直す</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f4f8;color:#351c3c;font:17px/1.8 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:650px;margin:auto;padding:18px 16px 70px}section,article{background:#fff;padding:20px;border:1px solid #e0d5e4;border-radius:16px;margin:18px 0}h1{font-size:25px}h2{font-size:22px}h3{font-size:21px}label{display:block;font-weight:700;margin-top:16px}input,textarea,select,button,.btn{font:inherit;width:100%;padding:12px;border:1px solid #bfaac6;border-radius:10px}textarea{min-height:120px}button,.btn{display:block;text-align:center;text-decoration:none;background:#531a65;color:white;margin-top:16px;font-weight:700;cursor:pointer;min-height:48px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#ede5f0;color:#351c3c}img{width:100%;height:auto;border-radius:12px;margin:12px 0}p{white-space:pre-wrap}a{color:#531a65}.muted{font-size:14px;color:#66556b}.status{background:#fff5dd;padding:12px;border-radius:10px}[hidden]{display:none!important}:focus-visible{outline:3px solid orange;outline-offset:3px}</style><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><style>body{font-size:18px}p,li{font-size:17px;line-height:1.85}.muted{font-size:16px}button,.btn,input,textarea,select{font-size:18px}h1{font-size:29px}h2{font-size:24px}.admin-nav a{font-size:16px}#code{font-size:18px}#login[hidden]{display:none!important}</style><script src="./owner-runtime.js?v=20261028-firstparty1"></script></head><body><main id="top"><a href="./owner.html#top" target="_self">← お店の管理へ</a><h1>お店の紹介を直す</h1><p>タイトル → 画像 → 説明文を4セット。こちらで用意した内容から、変えたいところだけ直せます。</p><p id="status" role="status" aria-live="polite" hidden class="status"></p>
<button id="retryLogin" class="secondary" type="button" hidden>もう一度接続する</button><section id="login"><p class="muted">このスマホでは30日間ログインを保持します。</p><form id="loginForm"><label for="code">専用コード</label><input id="code" type="password" autocomplete="current-password" required><button>自分のお店を開く</button></form></section>
<section id="admin" hidden><label for="target">編集するお店</label><select id="target"><option value="SHOP-0001">おうちcafeパン工房</option><option value="SHOP-0002">ハートネット志木</option><option value="SHOP-0003">ニュータイムス社</option></select></section>
<div id="editor" hidden><h2 id="shopName"></h2><p class="muted">画像を選び直さなければ、今の画像をそのまま使います。</p><form id="sceneForm"><div id="fields"></div><button id="previewButton">プレビューで確認する</button></form></div>
<section id="review" hidden><button type="button" id="backToEditor" class="secondary">← 情報を直す画面に戻る</button><h2>お客さんに見える内容</h2><p class="muted">まだ保存されていません。</p><div id="preview"></div><button id="save">この内容で保存・公開する</button><button type="button" id="rewrite" class="secondary">← 情報を直す画面に戻る</button></section><a id="publicLink" class="btn secondary" hidden target="_blank" rel="noopener">お店の紹介ページを見る</a></main><script>
'use strict';
const sessionMemory=window.omiseOwnerSession;
const $=id=>document.getElementById(id),base='https://ichirohns-jpg.github.io/ShikiConcierge-18/omise-demo/';let session=null,shopId='',scenes=[],revision='',pending=false,dirty=false,editorScroll=0;
function status(t){$('status').hidden=false;$('status').textContent=t;}
function busy(on){pending=on;document.querySelectorAll('button,input,textarea,select').forEach(e=>e.disabled=on);}
function rpc(name,args){busy(true);return window.omiseOwnerCall(name,args).then(r=>{busy(false);return r;},e=>{busy(false);status(e.message||String(e));throw e;});}
function node(tag,text){const n=document.createElement(tag);if(text)n.textContent=text;return n;}
function setLink(){const slug={'SHOP-0001':'ouchicafe','SHOP-0002':'heartnet','SHOP-0003':'newtimes'}[shopId];$('publicLink').href=base+slug+'.html?updated='+Date.now();$('publicLink').hidden=!slug;}
async function load(){if(!session)return;$('retryLogin').hidden=true;try{const r=await rpc('merchantScenesGet',[session.id,session.code,$('target').value]);shopId=r.shopId;scenes=r.scenes;revision=r.revision;dirty=false;$('shopName').textContent=r.name;$('login').hidden=true;$('editor').hidden=false;$('review').hidden=true;render();setLink();status('変えたいところを直して、プレビューで確認してください。');}catch(e){if(sessionMemory.authError(e)){sessionMemory.forget();session=null;$('login').hidden=false;status('ログインの有効期限が切れました。専用コードを入力してください。');}else{$('login').hidden=true;$('retryLogin').hidden=false;status('接続できませんでした。保存したログイン情報と入力内容は残っています。');}}}
function render(){$('fields').replaceChildren();scenes.forEach((s,i)=>{const card=node('article');card.append(node('h2','紹介 '+(i+1)));for(const [key,label,tag] of [['title','タイトル','input'],['src','画像','file'],['body','説明文','textarea']]){const id='scene-'+i+'-'+key,l=node('label',label);l.htmlFor=id;card.append(l);if(tag==='file'){const img=node('img');img.src=s.src;img.alt=s.alt||s.title;card.append(img);const f=node('input');f.type='file';f.accept='image/*';f.id=id;f.onchange=async()=>{if(!f.files[0])return;busy(true);try{const data=await photo(f.files[0]);s.src=data;s.alt=s.title;s.illustration=false;img.src=data;dirty=true;status('画像を差し替えました。まだ保存されていません。');}catch(e){f.value='';status(e.message);}finally{busy(false);}};card.append(f);}else{const input=node(tag);input.id=id;input.maxLength=key==='title'?80:1500;input.required=true;input.value=s[key]||'';input.oninput=()=>{s[key]=input.value;dirty=true;};card.append(input);}}$('fields').append(card);});}
async function photo(f){if(!f.type.startsWith('image/'))throw Error('写真を選んでください。');const image=await new Promise((resolve,reject)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);resolve(im);};im.onerror=()=>{URL.revokeObjectURL(u);reject(Error('画像を読み込めません。JPEGなどの画像を選んでください。'));};im.src=u;});const c=document.createElement('canvas'),r=Math.min(1,1200/Math.max(image.width,image.height));c.width=Math.round(image.width*r);c.height=Math.round(image.height*r);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(image,0,0,c.width,c.height);let data;for(let q=.8;q>=.2;q-=.1){data=c.toDataURL('image/jpeg',q);if(data.length<=240000)return data;}throw Error('写真が大きすぎます。別の写真を選んでください。');}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const code=$('code').value.trim(),r=await rpc('postLoginByCode',[code,true]);session={id:r.loginId,code:r.auth?.token||code};const saved=sessionMemory.save(r.auth);if(!saved)status('このブラウザではログインを保存できませんでした。');$('code').value='';$('admin').hidden=session.id!=='ADMIN';await load();}catch{}};
$('target').onchange=()=>{if(dirty&&!confirm('保存していない変更を閉じて、別のお店を開きますか？')){$('target').value=shopId;return;}load();};
$('sceneForm').onsubmit=e=>{e.preventDefault();if(pending)return;editorScroll=window.scrollY;$('preview').replaceChildren();scenes.forEach(s=>{const a=node('article'),img=node('img');img.src=s.src;img.alt=s.alt||s.title;a.append(node('h3',s.title),img,node('p',s.body));if(s.illustration)a.append(node('p','活動紹介用のイメージ'));$('preview').append(a);});$('editor').hidden=true;$('admin').hidden=true;$('review').hidden=false;$('review').scrollIntoView();};
function returnToEditor(){if(pending)return;$('review').hidden=true;$('editor').hidden=false;$('admin').hidden=session.id!=='ADMIN';$('previewButton').focus({preventScroll:true});window.scrollTo({top:editorScroll,behavior:'instant'});}
$('rewrite').onclick=returnToEditor;$('backToEditor').onclick=returnToEditor;
$('save').onclick=async()=>{if(pending)return;try{const r=await rpc('merchantScenesSave',[session.id,session.code,shopId,{revision,scenes}]);revision=r.revision;dirty=false;$('review').hidden=true;$('editor').hidden=false;$('admin').hidden=session.id!=='ADMIN';setLink();status(r.message);$('status').scrollIntoView();}catch{}};
function restoreSceneLogin(){const saved=sessionMemory.read();if(!saved)return;session={id:saved.id,code:saved.token};$('login').hidden=true;$('admin').hidden=saved.id!=='ADMIN';load();}
$('retryLogin').onclick=()=>{if(session)load();else restoreSceneLogin();};restoreSceneLogin();
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
</script></body></html>
