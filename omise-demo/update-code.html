<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>投稿システム更新コード</title>
  <style>
    :root{color-scheme:light;--green:#146b57;--ink:#173b32;--pale:#eef5f0}
    *{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;line-height:1.7}
    main{max-width:680px;margin:auto;padding:24px 18px 48px}.card{background:#fff;border:1px solid #c9ddd2;border-radius:22px;padding:24px;box-shadow:0 8px 28px #173b3214}
    h1{font-size:26px;margin:0 0 10px}.lead{font-weight:700}.step{padding:14px 0;border-top:1px solid #dce8e1}.step strong{display:block;font-size:19px}
    button{width:100%;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:22px;font-weight:800;padding:18px;margin:10px 0;cursor:pointer}
    button:disabled{opacity:.55}.status{padding:12px 14px;border-radius:12px;background:#fff5d9;font-weight:700}.done{background:#dff3e7;color:#075f42}
    a{color:var(--green);font-weight:700}.small{font-size:14px;color:#5f756b}
  </style>
</head>
<body><main><section class="card">
  <h1>投稿システムを更新</h1>
  <p class="lead">長いコードを探す必要はありません。下のボタンを1回押してください。</p>
  <button id="copy" type="button">最新コードをコピー</button>
  <p id="status" class="status" role="status">まだコピーしていません。</p>
  <div class="step"><strong>次にApps Scriptへ戻る</strong>今入っているコードをすべて選び、貼り付けます。</div>
  <div class="step"><strong>最後に新バージョンをデプロイ</strong>「デプロイ」→「デプロイを管理」→鉛筆→「新バージョン」→「デプロイ」です。</div>
  <p class="small">このコードには、各店の操作画面から使えるSNS広告画像作成と、投稿・削除・OGP画像の機能が入っています。</p>
</section></main>
<script>
const button=document.getElementById('copy'),status=document.getElementById('status');
button.addEventListener('click',async()=>{
  button.disabled=true;status.className='status';status.textContent='最新コードを読み込んでいます…';
  try{
    const response=await fetch('../tools/omise-release/LiveCode.txt?v=20261027-admaker1',{cache:'no-store'});
    if(!response.ok)throw new Error('コードを取得できませんでした。');
    const code=await response.text();
    await navigator.clipboard.writeText(code);
    status.className='status done';status.textContent='コピーできました。Apps Scriptへ戻って貼り付けてください。';button.textContent='コピー済み';
  }catch(error){status.textContent='コピーできませんでした。Safariで開き直して、もう一度押してください。';button.disabled=false;}
});
</script></body></html>
