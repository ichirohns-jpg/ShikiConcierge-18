name: Update shop post share images
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'tools/omise-release/build-post-shares.mjs'
      - 'tools/omise-release/test-post-share-pages.mjs'
      - '.github/workflows/omise-post-shares.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: omise-post-shares
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/omise-release/test-post-share-pages.mjs
      - run: node tools/omise-release/build-post-shares.mjs
      - name: Publish updated share pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- omise-demo/post-shares p
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update public shop post share pages'
          git push origin HEAD:main
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
